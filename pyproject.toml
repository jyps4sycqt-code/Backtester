[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trader"
version = "0.1.0"
description = "Weekly basket rotation strategy: shared pipeline, backtest harness, and paper trader."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "pyarrow>=12",
    "python-dateutil>=2.8",
    "requests>=2.28",
    "tabulate>=0.9",
]

[project.optional-dependencies]
yfinance = ["yfinance>=0.2"]
plot = ["matplotlib>=3.7"]
alpaca = ["alpaca-py>=0.20"]
dev = [
    "pytest>=7",
    "matplotlib>=3.7",
]

[project.scripts]
trader = "trader.cli:main"
backtest = "backtest.cli:main"
paper = "paper.cli:main"

[tool.setuptools.packages.find]
include = ["trader*", "backtest*", "paper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
